  <text x="65" y="577" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff">E</text>
  <text x="80" y="577" font-size="9" fill="#2c3e50">Extincteur</text>

  <rect x="155" y="566" width="4" height="14" fill="#27ae60"/>
