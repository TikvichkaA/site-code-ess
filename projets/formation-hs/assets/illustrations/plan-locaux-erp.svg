  <circle cx="70" cy="115" r="16" fill="#1a5276"/>
  <text x="70" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="175" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5276">ACCUEIL</text>
  <text x="175" y="138" text-anchor="middle" font-size="10" fill="#5d6d7e">Reception des clients</text>

  <!-- Desk accueil -->
