  <text x="265" y="279" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">E</text>
  <!-- Salle pratique -->
  <circle cx="440" cy="505" r="8" fill="#e74c3c" opacity="0.9"/>
  <text x="440" y="509" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff">E</text>
  <!-- Salle theorique -->
