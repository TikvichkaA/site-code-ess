  <circle cx="535" cy="205" r="5" fill="#a9dfbf" stroke="#27ae60" stroke-width="1"/>
  <circle cx="505" cy="235" r="5" fill="#a9dfbf" stroke="#27ae60" stroke-width="1"/>
  <circle cx="520" cy="235" r="5" fill="#a9dfbf" stroke="#27ae60" stroke-width="1"/>
  <circle cx="535" cy="235" r="5" fill="#a9dfbf" stroke="#27ae60" stroke-width="1"/>

