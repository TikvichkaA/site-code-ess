  <line x1="40" y1="305" x2="480" y2="305" stroke="#2c3e50" stroke-width="3"/>

  <!-- ========== VERTICAL DIVIDER (Accueil | Salle Theorique) ========== -->
  <line x1="310" y1="85" x2="310" y2="305" stroke="#2c3e50" stroke-width="3"/>

