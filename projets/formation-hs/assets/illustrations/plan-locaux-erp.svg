  <text x="260" y="428" text-anchor="middle" font-size="7" fill="#e67e22">Fauteuil + plan</text>
  <text x="260" y="440" text-anchor="middle" font-size="7" fill="#e67e22">de travail</text>

  <rect x="340" y="385" width="100" height="65" rx="8" fill="#fad7a0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="390" y="415" text-anchor="middle" font-size="8" fill="#e67e22" font-weight="bold">Poste 3</text>
  <text x="390" y="428" text-anchor="middle" font-size="7" fill="#e67e22">Fauteuil + plan</text>
