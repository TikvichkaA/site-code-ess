<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="hatchGray" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d5dbdb" stroke-width="0.8"/>
    </pattern>
    <marker id="exitArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="620" rx="16" fill="#f8fbf9"/>

