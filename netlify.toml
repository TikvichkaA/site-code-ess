[build]
  publish = "."
  command = ""

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache CSS files (1 week)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Cache JS files (1 week)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Cache images (1 month)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# Cache fonts (1 year)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL rewrites (200 = serve sans redirect, URL reste propre)
[[redirects]]
  from = "/formations"
  to = "/formations.html"
  status = 200

[[redirects]]
  from = "/qui-suis-je"
  to = "/qui-suis-je.html"
  status = 200

[[redirects]]
  from = "/offre-cci"
  to = "/offre-cci.html"
  status = 200

[[redirects]]
  from = "/webinaire-ia-ess"
  to = "/webinaire-ia-ess.html"
  status = 200

# Trailing slash redirect
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
